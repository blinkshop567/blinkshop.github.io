<!DOCTYPE html>
<html>
<head>
  <title>BlinkShop</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      margin: 0;
      color: #1a1a1a;
      overflow-x: hidden;
      background: linear-gradient(120deg, #fdfbfb, #ebedee);
    }

    /* glowing background */
    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.4;
      z-index: -1;
      animation: float 10s infinite alternate ease-in-out;
    }

    body::before {
      background: #00c853;
      top: -100px;
      left: -100px;
    }

    body::after {
      background: #00bcd4;
      bottom: -100px;
      right: -100px;
      animation-delay: 3s;
    }

    @keyframes float {
      from { transform: translateY(0px); }
      to { transform: translateY(60px); }
    }

    h1 {
      margin-top: 20px;
      font-size: 32px;
    }

    .product {
      background: rgba(255,255,255,0.7);
      backdrop-filter: blur(10px);
      margin: 20px;
      padding: 15px;
      border-radius: 20px;
      display: inline-block;
      width: 220px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
      transition: transform 0.3s;
    }

    .product:hover {
      transform: translateY(-8px) scale(1.03);
    }

    img {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 10px;
    }

    button {
      background: linear-gradient(135deg, #00c853, #00bcd4);
      color: white;
      padding: 10px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 5px;
      transition: transform 0.2s;
    }

    button:hover {
      transform: scale(1.05);
    }

    #location {
      margin-top: 10px;
      font-size: 14px;
    }
  </style>
</head>

<body>

<h1>🚀 BlinkShop (10 min delivery)</h1>
<p>Order now on WhatsApp</p>

<div class="product">
  <img src="https://upload.wikimedia.org/wikipedia/commons/0/0b/Milk_glass.jpg">
  <h3>Milk</h3>
  <p>₹60</p>
  <button onclick="order('Milk')">Order</button>
</div>

<div class="product">
  <img src="https://upload.wikimedia.org/wikipedia/commons/a/a4/Bread.jpg">
  <h3>Bread</h3>
  <p>₹40</p>
  <button onclick="order('Bread')">Order</button>
</div>

<div class="product">
  <img src="https://upload.wikimedia.org/wikipedia/commons/6/69/Potato-Chips.jpg">
  <h3>Chips</h3>
  <p>₹20</p>
  <button onclick="order('Chips')">Order</button>
</div>

<br><br>

<button onclick="getLocation()">📍 Share Location</button>
<p id="location"></p>

<script>
function getLocation() {
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(function(position) {
      let lat = position.coords.latitude;
      let lon = position.coords.longitude;

      document.getElementById("location").innerText =
        "Your Location: " + lat + ", " + lon;
    });
  } else {
    alert("Geolocation not supported");
  }
}

function order(item) {
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(function(position) {
      let lat = position.coords.latitude;
      let lon = position.coords.longitude;

      let phone = "91XXXXXXXXXX"; // put your number

      let message = encodeURIComponent(
        "I want to order " + item +
        " Location: https://maps.google.com/?q=" + lat + "," + lon
      );

      window.open("https://wa.me/" + phone + "?text=" + message);
    });
  } else {
    alert("Location not supported");
  }
}
</script>

</body>
</html>
