<!DOCTYPE html>
<html>
<head>
  <title>BlinkShop</title>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: linear-gradient(to right, #e0f7fa, #ffffff);
    }

    .product {
      background: white;
      margin: 20px;
      padding: 15px;
      border-radius: 15px;
      display: inline-block;
      width: 220px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: transform 0.3s;
    }

    .product:hover {
      transform: scale(1.05);
    }

    button {
      background: #00c853;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<h1>🚀 BlinkShop (10 min delivery)</h1>
<p>Order now on WhatsApp</p>

<div class="product">
  <img src="https://via.placeholder.com/150" width="150">
  <h3>Milk</h3>
  <p>₹60</p>
  <button onclick="order('Milk')">Order</button>
</div>

<div class="product">
  <h3>Bread</h3>
  <p>₹40</p>
  <button onclick="order('Bread')">Order</button>
</div>

<div class="product">
  <h3>Chips</h3>
  <p>₹20</p>
  <button onclick="order('Chips')">Order</button>
</div>

<button onclick="getLocation()">Share Location</button>
<p id="location"></p>

<script>
function getLocation() {
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(function(position) {
      let lat = position.coords.latitude;
      let lon = position.coords.longitude;

      document.getElementById("location").innerText =
        "Location: " + lat + ", " + lon;
    });
  } else {
    alert("Geolocation not supported");
  }
}

function order(item) {
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(function(position) {
      let lat = position.coords.latitude;
      let lon = position.coords.longitude;

      let phone = "91XXXXXXXXXX";

      let message = encodeURIComponent(
        "I want to order " + item +
        " Location: https://maps.google.com/?q=" + lat + "," + lon
      );

      window.open("https://wa.me/" + phone + "?text=" + message);
    });
  } else {
    alert("Location not supported");
  }
}
</script>

</body>
</html>
