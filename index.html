<!DOCTYPE html>
<html>
<head>
<title>BlinkShop</title>

<style>
body{
font-family:Arial;
margin:0;
text-align:center;
background:linear-gradient(120deg,#fdfbfb,#ebedee);
}

.dark{
background:#111;
color:white;
}

h1{margin:10px;}

.offer{
background:linear-gradient(135deg,#00c853,#00bcd4);
color:white;
padding:12px;
border-radius:25px;
display:inline-block;
margin:10px;
font-weight:bold;
}

/* SLIDER */
.slider{
width:90%;
margin:20px auto;
overflow:hidden;
border-radius:15px;
}

.slides{
display:flex;
transition:transform 0.5s ease;
}

.slide{
position:relative;
min-width:100%;
}

.slide img{
width:100%;
height:200px;
object-fit:cover;
filter:brightness(0.7);
}

/* TEXT OVERLAY */
.text{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
color:white;
font-size:22px;
font-weight:bold;
text-shadow:0 0 10px rgba(0,0,0,0.7);
}

.text.big{
font-size:28px;
letter-spacing:2px;
}

/* PRODUCTS */
.product{
background:white;
margin:15px;
padding:10px;
border-radius:15px;
display:inline-block;
width:200px;
}

.dark .product{background:#222;}

img{
width:120px;
height:120px;
object-fit:cover;
border-radius:10px;
}

button{
margin:5px;
padding:6px 10px;
border:none;
border-radius:8px;
background:#00c853;
color:white;
cursor:pointer;
}

#cart{
position:fixed;
right:10px;
top:10px;
width:230px;
background:white;
padding:10px;
border-radius:15px;
box-shadow:0 0 10px rgba(0,0,0,0.2);
text-align:left;
}

.dark #cart{background:#222;}

input{
padding:5px;
margin:5px;
}
</style>
</head>

<body>

<h1>🚀 BlinkShop</h1>

<div class="offer">
♻️ Sell Your Kabaad at Best Price & Get Free Delivery 🚚
</div>

<!-- SLIDER WITH TEXT -->
<div class="slider">
  <div class="slides" id="slides">

    <div class="slide">
      <img src="https://images.unsplash.com/photo-1542838132-92c53300491e">
      <div class="text" First Time in India</div>
    </div>

    <div class="slide">
      <img src="https://images.unsplash.com/photo-1606787366850-de6330128bfc">
      <div class="text">🚀 We Present</div>
    </div>

    <div class="slide">
      <img src="https://images.unsplash.com/photo-1586201375761-83865001e31c">
      <div class="text big">✨ THE BLINKSHOP ✨</div>
    </div>

  </div>
</div>

<br>

<input placeholder="Search..." oninput="search(this.value)">
<button onclick="toggleDark()">🌙</button>

<!-- PRODUCTS -->
<div id="products">

<div class="product" data-name="milk dairy">
<img src="https://upload.wikimedia.org/wikipedia/commons/0/0b/Milk_glass.jpg">
<h3>Milk</h3>
<p>₹60</p>
<button onclick="add('Milk',60)">Add</button>
</div>

<div class="product" data-name="bread bakery">
<img src="https://upload.wikimedia.org/wikipedia/commons/a/a4/Bread.jpg">
<h3>Bread</h3>
<p>₹40</p>
<button onclick="add('Bread',40)">Add</button>
</div>

<div class="product" data-name="chips snacks">
<img src="https://upload.wikimedia.org/wikipedia/commons/6/69/Potato-Chips.jpg">
<h3>Chips</h3>
<p>₹20</p>
<button onclick="add('Chips',20)">Add</button>
</div>

</div>

<!-- CART -->
<div id="cart">
<h3>🛒 Cart</h3>
<div id="cartItems">Empty</div>
<p>Total ₹<span id="total">0</span></p>

<input id="coupon" placeholder="Coupon">
<button onclick="applyCoupon()">Apply</button>

<br>
<button onclick="checkout()">Checkout</button>
</div>

<!-- PAYMENT -->
<div id="payment" style="display:none;">
<h2>💳 Payment</h2>
<p>Total: ₹<span id="payTotal"></span></p>
<button onclick="pay()">Pay Now</button>
</div>

<script>

/* CART */
let cart={};
let total=0;
let discount=0;

function add(item,price){
if(!cart[item]) cart[item]={qty:0,price:price};
cart[item].qty++;
updateCart();
}

function remove(item){
delete cart[item];
updateCart();
}

function changeQty(item,delta){
cart[item].qty+=delta;
if(cart[item].qty<=0) delete cart[item];
updateCart();
}

function updateCart(){
let html="";
total=0;

for(let i in cart){
let p=cart[i];
total+=p.qty*p.price;

html+= i+" x"+p.qty+
" <button onclick=\"changeQty('"+i+"',1)\">+</button>"+
" <button onclick=\"changeQty('"+i+"',-1)\">-</button>"+
" <button onclick=\"remove('"+i+"')\">❌</button><br>";
}

document.getElementById("cartItems").innerHTML=html||"Empty";
document.getElementById("total").innerText=total-discount;
}

/* COUPON */
function applyCoupon(){
let c=document.getElementById("coupon").value;
if(c=="SAVE10"){
discount=10;
alert("₹10 off applied");
}else{
alert("Invalid");
}
updateCart();
}

/* PAYMENT */
function checkout(){
document.getElementById("payment").style.display="block";
document.getElementById("payTotal").innerText=total-discount;
}

function pay(){
alert("Payment Successful 🎉");
startDeliveryTimer();
}

/* DELIVERY TIMER */
function startDeliveryTimer(){
let t=600;
let interval=setInterval(()=>{
t--;
let m=Math.floor(t/60);
let s=t%60;

document.body.innerHTML="<h1>🚚 Delivery in "+m+":"+s+"</h1>";

if(t<=0){
clearInterval(interval);
document.body.innerHTML="<h1>✅ Delivered!</h1>";
}
},1000);
}

/* SEARCH */
function search(val){
let items=document.querySelectorAll(".product");
items.forEach(p=>{
p.style.display=p.dataset.name.includes(val.toLowerCase())?"inline-block":"none";
});
}

/* DARK MODE */
function toggleDark(){
document.body.classList.toggle("dark");
}

/* SLIDER */
let index=0;
setInterval(()=>{
let slides=document.getElementById("slides");
let totalSlides=slides.children.length;

index=(index+1)%totalSlides;
slides.style.transform="translateX(-"+index*100+"%)";
},3000);

</script>

</body>
</html>
