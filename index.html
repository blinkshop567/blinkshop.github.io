<!DOCTYPE html>
<html>
<head>
  <title>QuickKart</title>
  <style>
    body { font-family: Arial; text-align: center; background: #f5f5f5; }
    .product { background: white; margin: 20px; padding: 15px; border-radius: 10px; display: inline-block; width: 200px; }
    button { background: green; color: white; padding: 10px; border: none; border-radius: 5px; }
  </style>
</head>

<body>

<h1>🚀 QuickKart (10 min delivery)</h1>
<p>Order now on WhatsApp</p>

<div class="product">
  <h3>Milk</h3>
  <p>₹60</p>
  <button onclick="order('Milk')">Order</button>
</div>

<div class="product">
  <h3>Bread</h3>
  <p>₹40</p>
  <button onclick="order('Bread')">Order</button>
</div>

<div class="product">
  <h3>Chips</h3>
  <p>₹20</p>
  <button onclick="order('Chips')">Order</button>
</div>

<script>
function order(item) {
  let phone = "91XXXXXXXXXX"; // put your number
  let message = "I want to order " + item;
  window.open("https://wa.me/" + phone + "?text=" + message);
}
</script>

</body>
</html>
